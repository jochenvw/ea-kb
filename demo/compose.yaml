services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ekb
      POSTGRES_PASSWORD: ekb
      POSTGRES_DB: ekb
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekb"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
