services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ekb
      POSTGRES_PASSWORD: ekb
      POSTGRES_DB: ekb
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ekb"]
      interval: 2s
      timeout: 3s
      retries: 20
  web:
    build: .
    profiles: ["app"]
    environment:
      EKB_DATABASE_URL: postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      EKB_DATA_DIR: /data
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["ekb", "web", "--host", "0.0.0.0"]
  worker:
    build: .
    profiles: ["app"]
    environment:
      EKB_DATABASE_URL: postgresql+asyncpg://ekb:ekb@postgres:5432/ekb
      EKB_DATA_DIR: /data
    volumes:
      - artifacts:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["ekb", "worker", "--manifest", "sources/public.yaml"]
volumes:
  postgres-data:
  artifacts:
