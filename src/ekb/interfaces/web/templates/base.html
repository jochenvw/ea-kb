<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enterprise Knowledge Base</title>
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="stylesheet" href="/static/theme.css">
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header><a href="/">EKB</a><span>Enterprise Knowledge Base</span><a href="/benchmarks">Benchmarks</a><a href="/review">Review</a><a href="/docs">API</a></header>
  <main>
    <p class="notice">Extracted candidates are not approved enterprise policy. Modality reflects source wording; applicability requires review.</p>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
