  - id: nist-csf-2.0
    framework_namespace: nist-csf
    framework_revision: "2.0"
    enterprise_requirement: Adhere to NIST Cybersecurity Framework 2.0.
    publisher: US National Institute of Standards and Technology
    name: NIST Cybersecurity Framework 2.0 (selected OSCAL outcomes)
    location: https://raw.githubusercontent.com/usnistgov/oscal-content/main/nist.gov/CSF/v2.0/json/NIST_CSF_v2.0_catalog.json
    format: oscal
    category: cybersecurity
    retrieval: oscal
    jurisdiction: United States
    access_notes: Official usnistgov repository; US government material. Follow repository license and third-party notices. Upstream main is mutable; original bytes and SHA-256 are retained.
    intended_scope: Voluntary cybersecurity outcomes; applicability and enterprise binding status require a separate decision.
    control_ids: [GV.OC-01, GV.RM-01, PR.AA-01]
  - id: nist-sp800-53-rev5
    framework_namespace: nist-sp-800-53
    framework_revision: "5"
    enterprise_requirement: Use NIST SP 800-53 Revision 5 as the cybersecurity control baseline.
    publisher: US National Institute of Standards and Technology
    name: NIST SP 800-53 revision 5 (selected OSCAL controls)
    location: https://raw.githubusercontent.com/usnistgov/oscal-content/main/nist.gov/SP800-53/rev5/json/NIST_SP-800-53_rev5_catalog.json
    format: oscal
    category: cybersecurity
    retrieval: oscal
    jurisdiction: United States
    access_notes: Official usnistgov repository; US government material. Review third-party notices. Original catalog retained; only selected controls parsed.
    intended_scope: Selected access, incident response, boundary protection and input-validation controls; parameter placeholders remain unresolved. Publication does not establish enterprise authority.
    control_ids:
      [ac-1, ac-2, ac-6, cm-6, cp-9, ir-4, sc-5, sc-7, sc-7.5, sc-28, si-3, si-10, si-10.1, si-11]
    architecture_principles:
      - id: identity-account-management
        domain: Identity and access management
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: ac-2
          semantic_type: TechnicalRequirement
          excerpt_contains: Create, enable, modify, disable, and remove accounts
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: establish a secure identity and access controls using Azure Active Directory
        rationale: Azure identity and access controls refine NIST account management within the Identity and access management domain in support of the NIST SP 800-53 control baseline.
      - id: privileged-access
        domain: Identity and access management
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: ac-6
          semantic_type: ConceptualRequirement
          excerpt_contains: Employ the principle of least privilege, allowing only
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: protect privileged access to your Azure tenant and resources
        rationale: Azure privileged-access controls refine the NIST least-privilege requirement within the Identity and access management domain in support of the NIST SP 800-53 control baseline.
      - id: incident-handling
        domain: Incident response
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: ir-4
          semantic_type: ConceptualRequirement
          excerpt_contains: Implement an incident handling capability for incidents
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: enabling detection, investigation, and remediation processes
        rationale: Azure incident-response automation refines NIST incident handling within the Incident response domain in support of the NIST SP 800-53 control baseline.
      - id: network-segmentation
        domain: Network security
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: sc-7
          semantic_type: TechnicalRequirement
          excerpt_contains: Implement subnetworks for publicly accessible system components
        controls:
          - source_id: asb-v2-network
            heading: "NS-1: Implement security for internal traffic"
            semantic_type: PlatformRequirement
            excerpt_contains: enterprise segmentation principle
        rationale: Azure virtual-network segmentation refines NIST boundary separation within the Network security domain in support of the NIST SP 800-53 control baseline.
      - id: private-network-connectivity
        domain: Network security
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: sc-7
          semantic_type: ConceptualRequirement
          excerpt_contains: Communications at external managed interfaces
        controls:
          - source_id: asb-v2-network
            heading: "NS-2: Connect private networks together"
            semantic_type: PlatformRequirement
            excerpt_contains: virtual network peering or Private Link
        rationale: Azure virtual-network peering and Private Link refine NIST managed boundary interfaces within the Network security domain in support of the NIST SP 800-53 control baseline.
      - id: denial-of-service-protection
        domain: Network security
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: sc-5
          semantic_type: ConceptualRequirement
          excerpt_contains: denial-of-service attacks
        controls:
          - source_id: asb-v2-network
            heading: "NS-4: Protect applications and services from external network attacks"
            semantic_type: PlatformRequirement
            excerpt_contains: enabling DDoS standard protection
        rationale: Azure DDoS protection refines NIST denial-of-service protection within the Network security domain in support of the NIST SP 800-53 control baseline.
      - id: backup-and-recovery
        domain: Backup and recovery
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: cp-9
          semantic_type: TechnicalRequirement
          excerpt_contains: Conduct backups of system-level information
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: data and configuration backups
        rationale: Azure backup controls refine NIST information-system backup within the Backup and recovery domain in support of the NIST SP 800-53 control baseline.
      - id: endpoint-malware-protection
        domain: Endpoint security
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: si-3
          semantic_type: TechnicalRequirement
          excerpt_contains: system entry and exit points to detect and eradicate malicious code
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: endpoint detection and response (EDR) and anti-malware
        rationale: Azure endpoint detection and anti-malware controls refine NIST malicious-code protection within the Endpoint security domain in support of the NIST SP 800-53 control baseline.
      - id: data-at-rest-protection
        domain: Data protection
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: sc-28
          semantic_type: ConceptualRequirement
          excerpt_contains: "Protect the [unresolved OSCAL parameter: sc-28_odp.01]"
        controls:
          - source_id: asb-v2
            heading: Overview of Azure security controls (v2)
            semantic_type: PlatformRequirement
            excerpt_contains: protect, and monitor sensitive data assets
        rationale: Azure data-protection controls refine NIST protection of information at rest within the Data protection domain in support of the NIST SP 800-53 control baseline.
      - id: secure-configuration
        domain: Configuration management
        strategic_requirement_source_id: nist-sp800-53-rev5
        agnostic:
          source_id: nist-sp800-53-rev5
          heading: cm-6
          semantic_type: TechnicalRequirement
          excerpt_contains: Establish and document configuration settings for components employed
        controls:
          - source_id: asb-v2-network
            heading: "NS-1: Implement security for internal traffic"
            semantic_type: PlatformRequirement
            excerpt_contains: Adaptive Network Hardening to recommend network security group configurations
        rationale: Azure adaptive network hardening refines NIST secure-configuration requirements within the Configuration management domain in support of the NIST SP 800-53 control baseline.
