[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enterprise-knowledge"
version = "0.1.0"
description = "Incremental, evidence-grounded enterprise knowledge base"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.12,<3",
  "sqlalchemy[asyncio]>=2.0.44,<3",
  "asyncpg>=0.31,<1",
  "alembic>=1.17,<2",
  "httpx>=0.28,<1",
  "typer>=0.21,<1",
  "textual>=7,<9",
  "fastapi>=0.128,<1",
  "uvicorn>=0.40,<1",
  "jinja2>=3.1.6,<4",
  "python-multipart>=0.0.22",
  "pyyaml>=6,<7",
  "pymupdf>=1.26,<3",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0,<2",
  "beautifulsoup4>=4.14,<5",
  "mcp>=1.26,<2",
  "structlog>=25.5",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-instrumentation-fastapi>=0.60b0,<1",
  "azure-storage-blob>=12.27,<13",
  "azure-identity>=1.25,<2",
  "openpyxl>=3.1,<4",
  "aiohttp>=3.14.5",
]

[project.optional-dependencies]
azure = ["azure-monitor-opentelemetry>=1.8,<2"]
agent-framework = ["agent-framework-core>=1.0,<2", "agent-framework-openai>=1.0,<2"]

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
  "hypothesis>=6.150,<7",
  "ruff>=0.14,<1",
  "basedpyright>=1.37,<2",
]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple/"
default = true

[project.scripts]
ekb = "ekb.interfaces.cli:app"

[project.entry-points."ekb.connectors"]
filesystem = "ekb.adapters.sources:FilesystemConnector"
http = "ekb.adapters.sources:HTTPConnector"
oscal = "ekb.adapters.sources:HTTPConnector"
microsoft-security-benchmark = "ekb.adapters.sources.benchmarks:MicrosoftLearnBenchmarkConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/ekb"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
include = ["src", "tests", "scripts"]
strict = ["src/ekb/domain", "src/ekb/ports"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database"]
